plugins {
    id 'com.android.application'
}

android {
    namespace 'com.retro.explorer'
    compileSdk 34

    defaultConfig {
        applicationId "com.retro.explorer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs directly.
            // Replace with your own signing config before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
